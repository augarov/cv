# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-toml
      - id: detect-private-key

  # GitHub Actions workflows: actionlint's release binary from PyPI (no Go
  # toolchain); runs only when a workflow changes
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  # Python formatting with black
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        files: ^cv_renderer/
        language_version: python3

  # Import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        files: ^cv_renderer/
        args: ["--profile", "black"]

  # Linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        files: ^cv_renderer/
        additional_dependencies: [flake8-docstrings]
        args: ["--config", "cv_renderer/.flake8"]

  # Type checking with mypy from the project venv, so installed packages
  # bring their own type hints (needs `make install-deps-python` first)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project venv)
        entry: .venv/bin/mypy --config-file=cv_renderer/pyproject.toml cv_renderer/src cv_renderer/tests
        language: system
        pass_filenames: false
        files: ^cv_renderer/
        types: [python]

  # Python security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^cv_renderer/src
        args: ["-c", "cv_renderer/pyproject.toml"]

  # JavaScript linting with local ESLint setup
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'realpath "$@" | xargs pnpm -C gh-pages exec eslint --fix --max-warnings=0' --
        language: system
        pass_filenames: true
        files: ^gh-pages/(src|tests)/.*\.(js|mjs|cjs|jsx|css)$

  # CSS linting with local Stylelint setup
  - repo: local
    hooks:
      - id: stylelint
        name: stylelint
        entry: bash -c 'realpath "$@" | xargs pnpm -C gh-pages exec stylelint --fix' --
        language: system
        pass_filenames: true
        files: ^gh-pages/src/.*\.(css|scss)$

  # HTML validation using local tools
  - repo: local
    hooks:
      - id: htmlhint
        name: htmlhint
        entry: bash -c 'realpath "$@" | xargs pnpm -C gh-pages exec htmlhint' --
        language: system
        pass_filenames: true
        files: ^gh-pages/src/.*\.html$

  # Prettier for consistent formatting across JS/HTML/CSS
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'realpath "$@" | xargs pnpm -C gh-pages exec prettier --write' --
        language: system
        pass_filenames: true
        files: \.(js|mjs|cjs|jsx|ts|tsx|css|scss|html|json|md|yml|yaml)$
        # Written by pnpm in its own format
        exclude: (^|/)pnpm-lock\.yaml$

# Global exclusions
exclude: |
  (?x)^(
    gh-pages/public/pdfjs/(?!web/custom\.(js|css)$).*|
    gh-pages/dist/.*|
    gh-pages/node_modules/.*|
    build/.*|
    \.git/.*|
    .*\.min\.(js|css)$|
    .*\.bundle\.(js|css)$|
    \.venv/.*|
    \.mypy_cache/.*
  )$

# Configuration for specific file types
default_stages: [pre-commit]
fail_fast: false
