name: Build CV

# Stage 1 (Python): the PDF and the website files, published as a release;
# then stage 2 (deploy_pages.yaml) builds and deploys the website from them.
# The only workflow that runs on push, so a push never starts two deploys: the
# paths are the stage 1 and stage 2 inputs in the Makefile, the same for push
# and pull_request.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_cv.yaml"
      - ".github/workflows/deploy_pages.yaml"
      - "cv/**"
      - "templates/**"
      - "cv_renderer/**"
      - "gh-pages/**"
      - "Makefile"
      - "scripts/**"

  # Builds both stages without releasing or deploying; the PDF and the bundle
  # are a workflow artifact
  pull_request:
    paths:
      - ".github/workflows/build_cv.yaml"
      - ".github/workflows/deploy_pages.yaml"
      - "cv/**"
      - "templates/**"
      - "cv_renderer/**"
      - "gh-pages/**"
      - "Makefile"
      - "scripts/**"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release to upload to (use a test tag, such as cv-test, for trial runs)"
        type: string
        default: cv-latest
      deploy:
        description: "Deploy the website to GitHub Pages"
        type: boolean
        default: true

jobs:
  build:
    name: Build PDF and website files
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload to the release.
    steps:
      - name: 🛎️ Checkout 🛎️
        uses: actions/checkout@v7
        with:
          lfs: true
          # Full history: the build date is the last commit that changed cv/
          fetch-depth: 0

      # uv installs the Python of cv_renderer/.python-version itself
      - name: 🐍 Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: cv_renderer/pyproject.toml

      - name: 📦 Install cv_renderer dependencies 📦
        run: |
          make install-deps-python

      - name: 🔄 Build PDF and website files 🔄
        run: |
          make build-release

      # The release action only creates a missing tag and never moves one, so
      # the release's commit and source archives would stay at its first run
      - name: Point the release tag at this commit
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'cv-latest' }}
        run: |
          git tag --force "${RELEASE_TAG}"
          git push --force origin "refs/tags/${RELEASE_TAG}"

      - name: Upload files to release
        if: github.event_name != 'pull_request'
        uses: svenstaro/upload-release-action@v2
        with:
          file: build/release/*
          file_glob: true
          overwrite: true
          tag: ${{ inputs.release_tag || 'cv-latest' }}
          release_name: ${{ inputs.release_tag || 'cv-latest' }}
          # Test releases must not become the repository's latest release
          prerelease: ${{ (inputs.release_tag || 'cv-latest') != 'cv-latest' }}
          body: "Latest build"

      - name: Upload files as workflow artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cv-build
          path: build/release/
          retention-days: 7

      # The PDF once more, unzipped, to open from the run page; the artifact
      # takes the file's name (cv.pdf)
      - name: Upload PDF as workflow artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: build/release/cv.pdf
          archive: false
          retention-days: 7

  run_deploy_pages:
    name: Deploy GH Pages
    needs: build
    permissions:
      pages: write # Required to deploy to GitHub Pages.
      id-token: write # Required to verify that the deployment originates from this workflow.
    uses: ./.github/workflows/deploy_pages.yaml
    with:
      release_tag: ${{ inputs.release_tag || 'cv-latest' }}
      bundle_artifact: ${{ github.event_name == 'pull_request' && 'cv-build' || '' }}
      # On push the inputs are empty: deploy. On pull_request they're empty
      # too, and a bare `inputs.deploy` would pass '' to the boolean input
      deploy: ${{ github.event_name == 'push' || inputs.deploy == true }}
