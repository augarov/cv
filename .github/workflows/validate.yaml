name: Validate

on:
  push:
    branches:
      - main

  pull_request:

  workflow_call:

jobs:
  validate:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout 🛎️
        uses: actions/checkout@v7
        with:
          lfs: true

      # The version is packageManager's in gh-pages/package.json, as locally
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gh-pages/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # The store itself, not setup-node's pnpm cache: setup-node asks pnpm for
      # the store from the repo root, where storeDir in gh-pages/ doesn't apply.
      # The store's layout version (.pnpm-store/v11) is in the key, so a pnpm
      # with a new layout doesn't restore and re-save the old store
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: .pnpm-store
          key: pnpm-store-v11-${{ runner.os }}-${{ hashFiles('gh-pages/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v11-${{ runner.os }}-

      # uv installs the Python of cv_renderer/.python-version itself
      - name: 🐍 Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: cv_renderer/pyproject.toml

      - name: 📦 Install pnpm dependencies 📦
        shell: bash
        run: |
          make install-deps-node-frozen

      - name: 📦 Install Python dependencies 📦
        run: |
          make install-deps-python

      - name: ✅ Run validations ✅
        run: |
          make validate-pre-commit

      - name: ✅ Run unit tests ✅
        run: |
          make test-renderer-unit

      - name: ✅ Run integration tests ✅
        run: |
          make test-renderer-integration

      - name: ✅ Run website unit tests ✅
        run: |
          make test-website-unit
