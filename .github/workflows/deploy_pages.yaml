name: Build & deploy GitHub Pages

# Stage 2 (Node): the website from the release bundle of stage 1 and the site
# sources. Keep the paths in sync with the stage 2 inputs in the Makefile, except
# the Makefile itself: build_cv.yaml runs on it and deploys, a second run here
# would race it.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy_pages.yaml"
      - "gh-pages/**"

  workflow_call:
    inputs:
      release_tag:
        description: "Release to download the website bundle from"
        type: string
        default: cv-latest
      deploy:
        description: "Deploy the website to GitHub Pages"
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release to download the website bundle from"
        type: string
        default: cv-latest
      deploy:
        description: "Deploy the website to GitHub Pages"
        type: boolean
        default: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout 🛎️
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: gh-pages/pnpm-lock.yaml

      - name: Install pnpm dependencies
        shell: bash
        run: |
          make install-deps-node-frozen

      # By tag, not the newest release: that may be a test release, or not yet
      # have the upload of the calling workflow
      - name: Download release
        uses: robinraju/release-downloader@v1.9
        with:
          tag: ${{ inputs.release_tag || 'cv-latest' }}
          fileName: gh-pages-bundle.tar.gz
          out-file-path: downloads
          tarBall: false
          zipBall: false

      - name: Build website
        run: |
          ls -la downloads
          make build-website-from-bundle

      - name: Fix permissions
        run: |
          chmod -v -R +rX "gh-pages/dist" | while read -r line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    # On push the inputs are empty: deploy. (Not `inputs.deploy != false`: the
    # loose comparison makes null equal to false.)
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    permissions:
      pages: write # Required to deploy to GitHub Pages.
      id-token: write # Required to verify that the deployment originates from this workflow.

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v4
