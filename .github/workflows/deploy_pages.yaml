name: Build & deploy GitHub Pages

# Stage 2 (Node): the website from the release bundle of stage 1 and the site
# sources. No push trigger: build_cv.yaml runs on the stage 2 inputs too and
# calls this workflow with its new bundle, so one push gives one deploy. Run it
# by hand to rebuild the site from an existing release.
on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release to download the website bundle from"
        type: string
        default: cv-latest
      bundle_artifact:
        description: "Workflow artifact of the calling run to take the bundle from instead of the release (pull requests)"
        type: string
        default: ""
      deploy:
        description: "Deploy the website to GitHub Pages"
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release to download the website bundle from"
        type: string
        default: cv-latest
      deploy:
        description: "Deploy the website to GitHub Pages"
        type: boolean
        default: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout 🛎️
        uses: actions/checkout@v7
        with:
          lfs: true

      # The version is packageManager's in gh-pages/package.json, as locally
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gh-pages/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # The store itself, not setup-node's pnpm cache: setup-node asks pnpm for
      # the store from the repo root, where storeDir in gh-pages/ doesn't apply.
      # The store's layout version (.pnpm-store/v11) is in the key, so a pnpm
      # with a new layout doesn't restore and re-save the old store
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: .pnpm-store
          key: pnpm-store-v11-${{ runner.os }}-${{ hashFiles('gh-pages/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v11-${{ runner.os }}-

      - name: Install pnpm dependencies
        shell: bash
        run: |
          make install-deps-node-frozen

      # By tag, not the newest release: that may be a test release, or not yet
      # have the upload of the calling workflow
      - name: Download release
        if: ${{ !inputs.bundle_artifact }}
        uses: robinraju/release-downloader@v1.13
        with:
          tag: ${{ inputs.release_tag || 'cv-latest' }}
          fileName: gh-pages-bundle.tar.gz
          out-file-path: downloads
          tarBall: false
          zipBall: false

      - name: Download bundle artifact
        if: ${{ inputs.bundle_artifact }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.bundle_artifact }}
          path: downloads

      - name: Build website
        run: |
          ls -la downloads
          make build-website-from-bundle

      # Before the upload: a failing check stops the deploy (and fails a PR)
      - name: Test built website
        run: |
          make test-website-dist-from-bundle

      # The browsers change with Playwright's version, not with every lockfile
      - name: Get Playwright version
        id: playwright
        run: |
          echo "version=$(pnpm -C gh-pages exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Before the upload too. --with-deps installs the browsers' system
      # libraries, which the cache doesn't hold
      - name: Browser tests
        run: |
          make test-website-e2e-from-bundle PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      # Traces and screenshots of the failed tests
      - name: Upload Playwright report
        if: ${{ failure() && steps.playwright.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: gh-pages/playwright-report
          retention-days: 14

      - name: Fix permissions
        run: |
          chmod -c -R +rX "gh-pages/dist" | while read -r line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload Pages artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    # Both triggers pass deploy as a boolean (build_cv.yaml: true on push)
    if: ${{ inputs.deploy }}
    permissions:
      pages: write # Required to deploy to GitHub Pages.
      id-token: write # Required to verify that the deployment originates from this workflow.

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v5
