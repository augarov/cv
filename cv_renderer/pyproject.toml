[project]
name = "cv-renderer"
version = "2.0.0"
description = "Render a rendercv CV to Typst, PDF and website files"
authors = [{name = "Anton Ugarov", email = "augarov.swe@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    # rendercv's Python API is internal: patch updates only (see CLAUDE.md)
    "rendercv[full]>=2.8,<2.9",
    "jinja2>=3.0.0,<4",
    "pyyaml>=6.0.3,<7",
    "markdown-it-py>=4.2,<5",
    "phonenumbers>=9.0.41,<10",
    "pydantic[email]>=2.14,<3",
    "coloredlogs>=15.0,<16",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "black>=26.10,<27",
    "isort>=9.0,<10",
    "mypy>=2.4,<3",
    "flake8>=7.4,<8",
    "pytest-cov>=7.1,<8",
    "pre-commit>=4.7,<5",
    "bandit>=1.9,<2",
    "types-PyYAML>=6.0.12,<7",
    "pillow>=12.3,<13",
]

[tool.poetry]
packages = [{include = "cv_renderer", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Development tools configuration
[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["cv_renderer"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Packages without type hints (no py.typed)
module = [
    "coloredlogs",
    "coloredlogs.*",
    "rendercv",
    "rendercv.*",
    "rendercv_fonts",
    "rendercv_fonts.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
pythonpath = ["src"]
markers = [
    "integration: builds whole CVs end to end (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Skip assert_used test
