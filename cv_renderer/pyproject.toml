[project]
name = "cv-renderer"
version = "2.0.0"
description = "Render a rendercv CV to Typst, PDF and website files"
authors = [{name = "Anton Ugarov", email = "augarov.swe@gmail.com"}]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    # rendercv's Python API is internal: patch updates only (see CLAUDE.md)
    "rendercv[full]>=2.8,<2.9",
    "jinja2>=3.0.0,<4",
    "pyyaml>=6.0.3,<7",
    "markdown-it-py>=4.2,<5",
    "phonenumbers>=9.0.41,<10",
    "pydantic[email]>=2.14,<3",
    "coloredlogs>=15.0,<16",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "mypy>=2.4,<3",
    "ruff>=0.17.3,<0.18",
    "pytest-cov>=7.1,<8",
    "pre-commit>=4.7,<5",
    "bandit>=1.9,<2",
    "types-PyYAML>=6.0.12,<7",
]

# The oldest uv this project works with (setup-uv in CI reads it too). Kept at
# Dependabot's uv, which lags behind uv releases: its uv updates fail when this
# is above its version. Raise it only when a feature needs it.
[tool.uv]
required-version = ">=0.13.5"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

# Development tools configuration
# Ruff: the linter and formatter (in place of flake8 with flake8-docstrings,
# isort and black). The Python version comes from requires-python; the
# default excludes cover .venv, build and the caches.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
# flake8's defaults (pycodestyle E / W, pyflakes F), flake8-docstrings (D)
# and isort (I)
select = ["E", "W", "F", "D", "I"]

[tool.ruff.lint.pydocstyle]
# flake8-docstrings' default
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["cv_renderer"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Packages without type hints (no py.typed)
module = [
    "coloredlogs",
    "coloredlogs.*",
    "rendercv",
    "rendercv.*",
    "rendercv_fonts",
    "rendercv_fonts.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Skip assert_used test
